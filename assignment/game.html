<!DOCTYPE html>
<html>
<head>
    <title>Catch The Box Game</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
        }

        h1 {
            margin-top: 20px;
        }

        #gameArea {
            width: 500px;
            height: 400px;
            background: white;
            border: 3px solid black;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
        }

        #box {
            width: 50px;
            height: 50px;
            background: red;
            position: absolute;
            cursor: pointer;
        }

        #score {
            font-size: 24px;
        }
    </style>
</head>

<body>

<h1>Catch The Box</h1>

<div id="score">Score: 0</div>

<div id="gameArea">
    <div id="box"></div>
</div>

<script>
    let box = document.getElementById("box");
    let scoreText = document.getElementById("score");
    let score = 0;

    function moveBox() {
        let gameArea = document.getElementById("gameArea");

        let maxX = gameArea.clientWidth - 50;
        let maxY = gameArea.clientHeight - 50;

        let randomX = Math.floor(Math.random() * maxX);
        let randomY = Math.floor(Math.random() * maxY);

        box.style.left = randomX + "px";
        box.style.top = randomY + "px";
    }

    box.onclick = function () {
        score++;
        scoreText.innerHTML = "Score: " + score;
        moveBox();
    };

    moveBox();

    setInterval(moveBox, 1000);
</script>

</body>
</html>
